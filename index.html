<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#E9F0F6; --surface:#FFFFFF; --surface2:#DDE8F1; --ink:#122238; --muted:#566A82;
  --ice:#8CC4E8; --glacier:#2D6FA3; --ember:#D9601F; --gold:#B8860B; --line:#C8D7E4;
  --hero-bg:#15345A; --hero-ink:#F2F8FD; --hero-muted:#A9C4DC; --hero-cell:#23466F; --focus:#2D6FA3;
  --win:#1F8A5B; --lose:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1422; --surface:#122039; --surface2:#1A2C48; --ink:#E6EEF6; --muted:#8EA2B9;
    --ice:#7FBCE6; --glacier:#8FCBF2; --ember:#FF8A4C; --gold:#F2C14E; --line:#243A5A;
    --hero-bg:#0F2744; --hero-ink:#F2F8FD; --hero-muted:#93AFCA; --hero-cell:#1B3A60; --focus:#8FCBF2;
    --win:#4CC98B; --lose:#FF7A6B;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1422; --surface:#122039; --surface2:#1A2C48; --ink:#E6EEF6; --muted:#8EA2B9;
  --ice:#7FBCE6; --glacier:#8FCBF2; --ember:#FF8A4C; --gold:#F2C14E; --line:#243A5A;
  --hero-bg:#0F2744; --hero-ink:#F2F8FD; --hero-muted:#93AFCA; --hero-cell:#1B3A60; --focus:#8FCBF2;
  --win:#4CC98B; --lose:#FF7A6B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
canvas.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.brand{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.coin{font-family:Silkscreen,monospace;font-size:14px}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.day{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(40px,13vw,58px);line-height:1;letter-spacing:-.03em}
.day span{font-size:.38em;font-weight:500;color:var(--hero-muted);letter-spacing:0;margin-left:6px}
.herosub{color:var(--hero-muted);font-size:14px;margin-top:6px}
.rankline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:16px;font-size:14px}
.rankline b{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:16px}
.bar{height:8px;background:var(--hero-cell);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8CC4E8,#E8F6FF);border-radius:99px;transition:width .5s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--hero-cell);border-radius:14px;padding:10px 12px}
.stat .v{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:19px}
.stat .l{font-size:12.5px;color:var(--hero-muted);line-height:1.3}
.stat.fire .v{color:#FFB37E}
.gridwrap{margin-top:16px;overflow-x:auto}
.months{display:grid;grid-template-columns:repeat(14,1fr);font-size:11.5px;color:var(--hero-muted);margin-bottom:4px;min-width:300px}
.frost{display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px;min-width:300px}
.cell{aspect-ratio:1;border-radius:5px;border:0;padding:0;background:var(--hero-cell);cursor:pointer;position:relative}
.cell.void{background:transparent;cursor:default}
.cell.future{opacity:.45;cursor:default}
.cell[data-l="1"]{background:#3F6F9C}.cell[data-l="2"]{background:#5F95C4}.cell[data-l="3"]{background:#8CC4E8}.cell[data-l="4"]{background:#E8F6FF;box-shadow:0 0 8px rgba(200,235,255,.6)}
.cell.today{outline:2px solid #FFB37E;outline-offset:1px}
.cell.sel::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#15345A}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-muted);margin-top:8px}
h2{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:18px;margin:28px 2px 12px;letter-spacing:-.01em}
h2 small{font-family:Figtree,sans-serif;font-weight:500;font-size:13.5px;color:var(--muted);margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
/* encounter */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;text-align:center}
.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fighter canvas{width:96px;height:120px}
.fighter .nm{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter .sc{font-family:Silkscreen,monospace;font-size:28px;line-height:1}
.vsmid{font-family:Silkscreen,monospace;font-size:18px;color:var(--muted);padding-bottom:40px}
.arena{background:linear-gradient(180deg,var(--surface2),var(--surface) 80%);border-radius:14px;padding:12px 8px 10px}
.enc-foot{font-size:14px;color:var(--muted);margin:10px 4px 0;text-align:center}
.enc-last{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.w{color:var(--win);font-weight:700}.l{color:var(--lose);font-weight:700}
/* week + checklist */
.week{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.week .nav{border:0;background:var(--surface2);width:32px;height:44px;border-radius:10px;cursor:pointer;flex:none;font-size:18px}
.week .nav:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.d{border:0;background:transparent;border-radius:12px;padding:6px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.d .n{font-weight:700;font-size:15px}
.d .wd{font-size:11.5px;color:var(--muted)}
.d .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.d .dot.p{background:var(--glacier)}.d .dot.f{background:var(--ember)}
.d.on{background:var(--ink);color:var(--bg)}.d.on .wd{color:var(--bg);opacity:.75}
.d:disabled{opacity:.35;cursor:default}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 8px;font-size:14px;color:var(--muted)}
.dayhead b{color:var(--ink);font-size:16px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:11px 6px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.item:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
.txt{flex:1;min-width:0}
.txt .t{font-weight:600}
.txt .s{font-size:13px;color:var(--muted)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.item[aria-checked="true"] .ck{background:var(--glacier);border-color:var(--glacier)}
.item[aria-checked="true"] .ck::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.item.na{cursor:default;opacity:.5}.item.na .ck{border-style:dashed}
.item:disabled{cursor:default}
.hobbies{display:flex;flex-wrap:wrap;gap:6px;margin:0 6px 10px 56px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.pill.on{background:var(--glacier);border-color:var(--glacier);color:var(--surface);font-weight:600}
.pill:disabled{opacity:.45;cursor:default}
.float{position:absolute;right:44px;top:8px;font-family:Silkscreen,monospace;font-size:14px;color:var(--glacier);pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-18px)}}
.locked{padding:14px 8px;text-align:center;color:var(--muted)}
.ro{font-size:13px;color:var(--muted);margin:8px 4px 0}
/* pomodoro */
.pomo{display:flex;flex-direction:column;align-items:center;gap:10px}
.pmtime{font-family:Silkscreen,monospace;font-size:52px;line-height:1;letter-spacing:.02em}
.pmphase{font-size:14px;color:var(--muted)}
.pmbar{width:100%;height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.pmbar i{display:block;height:100%;background:var(--ember);width:0}
.pmbtns{display:flex;gap:8px;width:100%}
.pmbtns button{flex:1}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:12px;border-radius:14px;cursor:pointer;font-size:15px}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.wide{width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--muted);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
/* perso */
.show{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.show canvas{width:160px;height:200px;background:radial-gradient(circle at 50% 85%,#2B5A8C 0,#15345A 65%);border-radius:16px}
.show .big{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.show .meta{color:var(--hero-muted);font-size:14px;margin-top:6px}
.show .wallet{font-family:Silkscreen,monospace;font-size:22px;margin-top:12px}
.show .rec{font-size:14px;margin-top:4px;color:var(--hero-muted)}
.tabsl{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.it canvas{width:64px;height:80px;background:var(--surface2);border-radius:10px}
.it .nm{font-weight:700;font-size:13px;line-height:1.25}
.it .rq{font-size:11.5px;color:var(--muted);line-height:1.3}
.it button{width:100%;padding:8px 4px;font-size:13px;border-radius:10px;margin-top:auto}
.it.eq{border-color:var(--glacier);box-shadow:inset 0 0 0 1px var(--glacier)}
/* editor */
.join{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.join h3{font-family:Unbounded,system-ui,sans-serif;font-size:17px;margin:0 0 4px}
.join p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
label,.lab{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.editor{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:8px}
.editor canvas{width:112px;height:140px;background:var(--surface2);border-radius:14px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.opts{display:flex;flex-wrap:wrap;gap:6px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.badge .e{font-size:26px;line-height:1.2}
.badge .bn{font-weight:700;font-size:13.5px;margin-top:4px;line-height:1.25}
.badge .bd{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:3px}
.badge .rw{font-family:Silkscreen,monospace;font-size:12px;color:var(--gold);margin-top:4px}
.badge .pg{height:4px;background:var(--surface2);border-radius:9px;margin-top:8px;overflow:hidden}
.badge .pg i{display:block;height:100%;background:var(--glacier)}
.badge.off .e{filter:grayscale(1);opacity:.45}
.badge.won{border-color:var(--glacier);box-shadow:inset 0 0 0 1px var(--glacier)}
/* board */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb canvas{width:40px;height:50px;flex:none}
.pos{font-family:Unbounded,system-ui,sans-serif;font-weight:700;width:22px;text-align:center;color:var(--muted)}
.lb li:first-child .pos{color:var(--ember)}
.who{flex:1;min-width:0}
.who .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .nm em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.who .rk{font-size:13px;color:var(--muted)}
.xp{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:15px;text-align:right}
.xp small{display:block;font-family:Figtree,sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
.me{background:var(--surface2);border-radius:12px}
.rival{font-size:14px;color:var(--muted);margin:10px 4px 0}
.note{font-size:13.5px;color:var(--muted);margin:14px 4px 0}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab span{font-size:20px;line-height:1.2;filter:grayscale(.6)}
.tab.on{color:var(--ink)}.tab.on span{filter:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;transition:all .3s;max-width:calc(100% - 32px);text-align:center;z-index:9;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.badges,.shop{grid-template-columns:repeat(2,1fr)}.show{grid-template-columns:1fr;justify-items:center;text-align:center}}
</style>
</head>

const ITEMS=[
 {id:'tee-white',slot:'top',n:'T-shirt blanc',price:0,c:'#E9EEF2',kind:'tee'},

function stats(pl){
  const days=(pl&&pl.days)||{};
  let xp=0,checks=0,perfect=0,run=0,best=0,sport=0,focus=0,hobby=0,alcohol=0,done=0,app=0,pomo=0;
  const ws={},ratio={},hobbyBy={};
  const t=today(),tk=key(t),last=t<END?t:END;
  for(let d=new Date(START);d<=last;d=add(d,1)){
    const k=key(d),r=days[k]||{};let dn=0,ap=0,score=0,apAll=0;
    pomo+=+r.pomo||0;
    for(const p of P){
      if(!appl(p,d))continue; apAll++;
      const v=!!r[p.k]; if(v) score++;
      if(p.k==='sport'){if(v){xp+=10;checks++;sport++;const w=key(monday(d));ws[w]=(ws[w]||0)+1;}continue;}
      ap++;
      if(v){dn++;xp+=10;checks++;if(p.k==='focus')focus++;if(p.k==='alcohol')alcohol++;
        if(p.k==='hobby'){hobby++;if(typeof r.hobby==='string'){const s=slug(r.hobby);hobbyBy[s]=(hobbyBy[s]||0)+1;}}}
    }
    ratio[k]={dn,ap,sport:!!r.sport,score};
    if(ap&&dn===ap){perfect++;xp+=25;run++;if(run>best)best=run;}
    else if(k!==tk)run=0;
    done+=dn;app+=ap;
  }
  const iron=Object.values(ws).filter(n=>n>=4).length; xp+=iron*50;
  const overall=app?done/app:0;
  return {xp,checks,perfect,streak:run,best,sport,focus,hobby,alcohol,iron,ws,ratio,overall,pomo,hobbyBy,finished:t>=END&&overall>=.7};
}
function badgesFor(pl,st){
  const list=BASE_BADGES.map(b=>{const [c,g]=b.p(st);return {id:b.id,e:b.e,n:b.n,d:b.d,r:b.r,c,g,won:c>=g};});
  const seen=new Set();
  for(const h of (pl&&pl.hobbies)||[]){const s=slug(h);if(seen.has(s))continue;seen.add(s);
    const cnt=st.hobbyBy[s]||0;
    HOBBY_TIERS.forEach(([g,title,r],i)=>list.push({id:'h'+(i+1)+'-'+s,e:hobbyEmoji(h),n:title+' '+h,d:g+' h de '+h,r,c:Math.min(cnt,g),g,won:cnt>=g,hob:h}));}
  return list;
}

const joinKey=p=>{if(!p||!p.joined)return key(START);const d=new Date(p.joined);const k=key(new Date(d.getFullYear(),d.getMonth(),d.getDate()));return k<key(START)?key(START):k;};
let PAIR={};
function pairFor(k){
  if(PAIR[k])return PAIR[k];
  const ids=Object.keys(S.players).filter(id=>S.players[id]&&S.players[id].pseudo&&joinKey(S.players[id])<=k).sort();
  const r=rng('winter-arc-'+k);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const m={};for(let i=0;i<ids.length;i+=2){if(i+1<ids.length){m[ids[i]]=ids[i+1];m[ids[i+1]]=ids[i];}else m[ids[i]]='yeti';}
  return PAIR[k]=m;
}
function yetiScore(k){const d=fromKey(k);return Math.ceil(P.filter(p=>p.k!=='sport'&&appl(p,d)).length*.6);}
function scoreOf(id,k){if(id==='yeti')return yetiScore(k);const s=ST[id];return s&&s.ratio[k]?s.ratio[k].score:0;}
function nameOf(id){return id==='yeti'?'Le Yéti':(S.players[id]&&S.players[id].pseudo)||'Joueur';}
function encounters(id){
  const out=[];const t=today();const last=add(t,-1)<END?add(t,-1):END;
  for(let d=new Date(START);d<=last;d=add(d,1)){const k=key(d);const opp=pairFor(k)[id];if(!opp)continue;
    const a=scoreOf(id,k),b=scoreOf(opp,k);if(a===0&&(opp==='yeti'||b===0))continue;
    out.push({k,opp,a,b,res:a>b?'w':a===b?'t':'l'});}
  return out;
}
function wallet(id){
  const p=S.players[id]||S.me,st=ST[id]||stats(p);
  const enc=encounters(id);const wins=enc.filter(e=>e.res==='w').length;st.wins=wins;
  const bs=badgesFor(p,st);
  let earned=bs.filter(b=>b.won).reduce((a,b)=>a+b.r,0)+st.perfect*COIN.perfect+st.pomo*COIN.pomo;
  for(const e of enc)earned+=COIN[e.res==='w'?'win':e.res==='t'?'tie':'loss'];
  const spent=((p&&p.owned)||[]).reduce((a,i)=>{const it=itemById(i);return a+(it?it.price:0)},0);
  return {earned,spent,bal:earned-spent,enc,wins,ties:enc.filter(e=>e.res==='t').length,losses:enc.filter(e=>e.res==='l').length,badges:bs};
}

function saveProfile(){
  const ps=S.draft.pseudo.trim();
  const ho=S.draft.hobbies.split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);
  if(!ps){toast('Choisis un pseudo.');return;}
  if(!S.canWrite){toast('Lecture seule : tu ne peux pas modifier ce profil.');return;}
  const first=!(S.me&&S.me.pseudo);
  const base=S.me||{days:{},owned:[],equip:{}};
  // retroactive hobby rename, by position
  const old=base.hobbies||[];
  if(base.days){for(let i=0;i<Math.min(old.length,ho.length);i++){if(old[i]!==ho[i]){for(const k in base.days){if(base.days[k]&&base.days[k].hobby===old[i])base.days[k]=Object.assign({},base.days[k],{hobby:ho[i]});}}}}
  S.me=Object.assign({},base,{pseudo:ps.slice(0,24),hobbies:ho,look:S.draft.look,joined:base.joined||Date.now(),updated:Date.now()});
  if(S.me.equip&&S.me.equip.hand&&S.me.equip.hand.startsWith('hob-')&&!ho.some(h=>'hob-'+hobbyKind(h)===S.me.equip.hand)){} // keep owned items
  S.editing=false;S.draft=null;
  if(S.mode!=='solo')S.players[S.uid]=S.me;

function shopItems(){
  const list=ITEMS.slice();

  for(const h of (S.me&&S.me.hobbies)||[]){const k=hobbyKind(h);if(seen.has(k))continue;seen.add(k);
    list.push(Object.assign({},itemById('hob-'+k),{req:'h1-'+slug(h),reqName:'Apprenti '+h}));}
  return list;
}
function buy(id){
  const it=shopItems().find(i=>i.id===id);if(!it||!S.canWrite)return;

  if(it.req&&!w.badges.find(b=>b.id===it.req&&b.won)){toast('Objet verrouillé');return;}
  if(w.bal<it.price){toast('Il te manque '+(it.price-w.bal)+' 💠');return;}
  S.me.owned=(S.me.owned||[]).concat(id);
  S.me.equip=Object.assign({},S.me.equip||{},{[it.slot]:id});
  recompute();render();save();toast('🛍️ '+it.n+' acheté et équipé');

const PMK='winter-arc-pomo';
let PM={phase:'work',preset:0,remain:25*60,endAt:null,running:false,act:'focus'};
try{const v=JSON.parse(localStorage.getItem(PMK)||'null');if(v)PM=Object.assign(PM,v);}catch(e){}
const pmSave=()=>{try{localStorage.setItem(PMK,JSON.stringify(PM))}catch(e){}};
const pmTotal=()=>(PM.phase==='work'?PM_PRESETS[PM.preset][0]:PM_PRESETS[PM.preset][1])*60;
const pmLeft=()=>PM.running?Math.max(0,Math.ceil((PM.endAt-Date.now())/1000)):PM.remain;
let audioCtx=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.15,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.2);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.22);});}catch(e){}}
function pmCmd(c){
  if(c==='start'){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){} PM.endAt=Date.now()+PM.remain*1000;PM.running=true;}
  if(c==='pause'){PM.remain=pmLeft();PM.running=false;PM.endAt=null;}
  if(c==='reset'){PM.phase='work';PM.running=false;PM.endAt=null;PM.remain=pmTotal();}
  if(c==='skip'){PM.running=false;PM.endAt=null;PM.phase=PM.phase==='work'?'break':'work';PM.remain=pmTotal();}
  pmSave();render();schedulePomoPush();
}
function pmComplete(){
  beep();
  if(PM.phase==='work'){
    const t=today();
    if(S.me&&S.me.pseudo&&S.canWrite&&inArc(t)){mutateDay(key(t),r=>{r.pomo=(+r.pomo||0)+1;});toast('🍅 Pomodoro terminé, +2 💠. Place à la pause.');
      const map={focus:'focus',hobby:'hobby',sport:'sport'};const pk=map[PM.act];const r=(S.me.days||{})[key(t)]||{};
      if(pk&&!r[pk]&&P.find(p=>p.k===pk&&appl(p,t)))S.pmSuggest=pk;}
    else toast('🍅 Pomodoro terminé. Place à la pause.');
    PM.phase='break';PM.remain=pmTotal();PM.endAt=Date.now()+PM.remain*1000;PM.running=true;
  } else {toast('Pause terminée, on repart ?');PM.phase='work';PM.remain=pmTotal();PM.running=false;PM.endAt=null;}
  pmSave();render();schedulePomoPush();
}

function persoHTML(w,st){
  const rk=rankOf(st.xp);
  let html=`<section class="show">${spr(S.uid,64)}<div><div class="big">${esc(S.me.pseudo)}</div><div class="meta">${rk.e} ${rk.name}, stade ${rk.i+1} sur 7${rk.next?'<br>'+rk.toNext+' XP pour grandir':''}</div><div class="wallet">${w.bal} 💠</div><div class="rec">Duels : ${w.wins} V, ${w.ties} N, ${w.losses} D</div></div></section>
  <button class="btn sec wide" id="editp">Modifier pseudo, loisirs et apparence</button>${S.mode==='shared'?'<button class="btn ghost wide" id="signout">Se déconnecter</button>':''}`+notifHTML();
  const items=shopItems().filter(i=>i.slot===S.slot);
  html+=`<h2>Boutique</h2><div class="tabsl">${SLOTS.map(([k,l])=>`<button class="pill ${S.slot===k?'on':''}" data-slot="${k}">${l}</button>`).join('')}</div><div class="shop">`;
  const eq=Object.assign({top:'tee-white',bottom:'jog-grey'},S.me.equip||{});
  for(const it of items){
    const owned=it.price===0||(S.me.owned||[]).includes(it.id);
    const reqB=it.req?w.badges.find(b=>b.id===it.req):null;const locked=it.req&&!(reqB&&reqB.won);
    const isEq=eq[it.slot]===it.id;
    let btn,rq='';
    if(owned)btn=`<button class="btn ${isEq?'':'sec'}" data-equip="${it.id}" ${S.canWrite?'':'disabled'}>${isEq?(it.slot==='top'||it.slot==='bottom'?'Équipé':'Retirer'):'Équiper'}</button>`;
    else if(locked){rq='Succès requis : '+esc(it.reqName||(reqB?reqB.n:''));btn=`<button class="btn sec" disabled>🔒 ${it.price} 💠</button>`;}
    else btn=`<button class="btn" data-buy="${it.id}" ${w.bal<it.price||!S.canWrite?'disabled':''}>${it.price} 💠</button>`;
    html+=`<div class="it ${isEq?'eq':''}">${spr(S.uid,32,'data-item="'+it.id+'"')}<div class="nm">${esc(it.n)}</div>${rq?`<div class="rq">${rq}</div>`:''}${btn}</div>`;
  }
  html+='</div><p class="note">💠 Tu gagnes des cristaux avec les duels, les succès, les journées parfaites (+5) et les pomodoros (+2).</p>';
  return html;
}
function badgesHTML(w){
  const won=w.badges.filter(b=>b.won).length;
  return `<h2>Succès <small>${won}/${w.badges.length}</small></h2><div class="badges">`+w.badges.map(b=>`<div class="badge ${b.won?'won':'off'}"><div class="e">${b.e}</div><div class="bn">${esc(b.n)}</div><div class="bd">${b.won?'Débloqué':esc(b.d)}</div><div class="rw">+${b.r} 💠</div>${b.g>1&&!b.won?`<div class="pg"><i style="width:${Math.round(b.c/b.g*100)}%"></i></div>`:''}</div>`).join('')+'</div><p class="note">Les succès de loisir s’adaptent à ceux que tu as choisis dans ton profil.</p>';
}
function boardHTML(){
  const list=Object.keys(S.players).filter(id=>S.players[id]&&S.players[id].pseudo).map(id=>({id,p:S.players[id],s:ST[id]})).sort((a,b)=>b.s.xp-a.s.xp);
  if(!list.length)return '<h2>Classement</h2><div class="card"><p class="locked">Personne n’a encore rejoint.</p></div>';
  let rival='';const myI=list.findIndex(x=>x.id===S.uid);
  if(myI>0){const ah=list[myI-1];const gap=ah.s.xp-list[myI].s.xp;rival=`<p class="rival">${gap===0?'Égalité avec '+esc(ah.p.pseudo)+', une case et tu passes devant.':'Plus que '+gap+' XP pour doubler '+esc(ah.p.pseudo)+'.'}</p>`;}
  else if(myI===0&&list.length>1){rival=`<p class="rival">Tu mènes avec ${list[0].s.xp-list[1].s.xp} XP d’avance sur ${esc(list[1].p.pseudo)}.</p>`;}
  return `<h2>Classement</h2><div class="card"><ul class="lb">`+list.map((x,i)=>{const rk=rankOf(x.s.xp);const me=x.id===S.uid;
    return `<li class="${me?'me':''}"><span class="pos">${i+1}</span>${spr(x.id,32)}<div class="who"><div class="nm">${esc(x.p.pseudo)}${me?'<em>toi</em>':''}</div><div class="rk">${rk.e} ${rk.name} · 🔥 ${x.s.streak}</div></div><div class="xp">${x.s.xp}<small>XP</small></div></li>`;}).join('')+`</ul>${rival}</div>
    <p class="note">${S.mode==='solo'?'Mode solo : ta progression reste sur cet appareil.':'Pour ajouter un pote, envoie-lui simplement le lien du site. Il crée son compte et son perso, et entre dans les duels dès le lendemain.'}</p>`;
}
function tabsHTML(){
  const T=[['today','🗓️','Aujourd’hui'],['perso','🧍','Perso'],['succes','🏅','Succès'],['board','🏆','Classement']];
  return '<div>'+T.map(([k,e,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}" aria-current="${S.tab===k}"><span>${e}</span>${l}</button>`).join('')+'</div>';
}
function render(){
  const app=document.getElementById('app'),nav=document.getElementById('tabs');
  if(S.mode==='loading'){app.innerHTML='<div class="top"><div class="brand">Winter Arc</div></div><p class="note">Chargement…</p>';nav.hidden=true;return;}
  if(S.mode==='auth'||S.mode==='config'){nav.hidden=true;app.innerHTML='<header class="top"><div class="brand">Winter Arc<small>2026</small></div></header>'+(S.mode==='auth'?authHTML():configHTML());return;}
  const joined=S.me&&S.me.pseudo;
  if(!ST[S.uid]&&S.me)recompute();
  const st=ST[S.uid]||stats(S.me);
  const w=joined?wallet(S.uid):null;
  let html=`<header class="top"><div class="brand">Winter Arc<small>2026</small></div>${joined?`<div class="chips"><button class="chip coin" data-tab="perso">${w.bal} 💠</button></div>`:''}</header>`;
  if(!joined){
    nav.hidden=true;
    if(S.mode==='readonly'){html+=`<div class="join"><h3>Mode spectateur</h3><p>Tu peux suivre le classement. Connecte-toi pour créer ton perso.</p></div>`+boardHTML();}
    else{if(!S.draft)openEditor();html+=editorHTML(true);}
  } else if(S.editing){nav.hidden=true;html+=editorHTML(false);}
  else{
    nav.hidden=false;nav.innerHTML=tabsHTML();
    if(S.tab==='today')html+=heroHTML(st)+encounterHTML(w)+dayHTML(st)+pomoHTML();
    if(S.tab==='perso')html+=persoHTML(w,st);
    if(S.tab==='succes')html+=badgesHTML(w);
    if(S.tab==='board')html+=boardHTML();
    if(S.mode==='readonly')html+='<p class="note">Lecture seule : demande une invitation comme éditeur pour cocher tes cases.</p>';
  }
  const y=window.scrollY;app.innerHTML=html;window.scrollTo(0,y);
  paintSprites();
}

// ================= events =================
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.draft;if(f&&S.draft)S.draft[f]=e.target.value;});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;const ds=t.dataset;
  if(ds.tab){S.tab=ds.tab;S.editing=false;render();window.scrollTo(0,0);return;}
  if(ds.day){S.sel=ds.day;render();return;}
  if(ds.wk){const d=add(fromKey(S.sel),+ds.wk);let c=d;if(!viewable(c))c=d>today()?today():START;if(viewable(c)){S.sel=key(c);render();}return;}
  if(ds.hb){const r=(S.me.days||{})[S.sel]||{};setPillar('hobby',r.hobby===ds.hb?null:ds.hb);return;}
  if(ds.sug){const k=ds.k;S.pmSuggest=null;const prev=S.sel;S.sel=key(today());const hs=S.me.hobbies||[];setPillar(k,k==='hobby'?(hs[0]||true):true);S.sel=prev;render();return;}
  if(ds.k){const r=(S.me.days||{})[S.sel]||{};const k=ds.k;
    if(k==='hobby'){const hs=S.me.hobbies||[];setPillar('hobby',r.hobby?null:(hs[0]||true));}else setPillar(k,r[k]?null:true);return;}
  if(ds.look){const [f,v]=ds.look.split(':');S.draft.look[f]=(f==='skin'||f==='hairColor')?+v:v;render();return;}
  if(ds.slot){S.slot=ds.slot;render();return;}
  if(ds.buy){buy(ds.buy);return;}
  if(ds.equip){equip(ds.equip);return;}
  if(ds.pm){pmCmd(ds.pm);return;}
  if(ds.pmact){PM.act=ds.pmact;pmSave();render();return;}
  if(ds.pmpreset){PM.preset=+ds.pmpreset;PM.phase='work';PM.remain=pmTotal();pmSave();render();return;}
  if(t.id==='saveprof'){saveProfile();return;}
  if(t.id==='cancel'){S.editing=false;S.draft=null;render();return;}
  if(t.id==='editp'){openEditor();render();window.scrollTo(0,0);return;}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PM.running&&pmLeft()<=0)pmComplete();});

// ================= notifications push =================
const VAPID_PUBLIC='BIH1v3AE-7iYp8Ob5RhEIAPfAze1OARBi3BmOxCICsRTsvP_dFFZBn_YeOe-PKEFEBrJixUX1OdC-gxBDgA0Gt0';
S.push={supported:false,on:false,busy:false,msg:''};
const NOTIF_TYPES=[['evening','Rappel de 20h s’il reste des piliers'],['duel','Résultat du duel le matin'],['overtake','Quand un pote te dépasse'],['pomo','Fin de pomodoro']];
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error('service worker indisponible')),4000))]);
function b64u(str){const pad='='.repeat((4-str.length%4)%4);const b=atob((str+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function refreshPush(){
  S.push.supported='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  if(!S.push.supported){S.push.msg=isIOS&&!isStandalone()?'Sur iPhone, ajoute d’abord l’app à l’écran d’accueil (Partager, puis Sur l’écran d’accueil), puis ouvre-la depuis son icône.':'Ce navigateur ne gère pas les notifications.';return;}
  try{const reg=await swReady();const sub=await reg.pushManager.getSubscription();S.push.on=!!sub&&Notification.permission==='granted';}catch(e){}
}
async function enablePush(){
  if(!SB||!S.push.supported)return;
  S.push.busy=true;S.push.msg='';render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){S.push.msg='Notifications refusées. Tu peux les réautoriser dans les réglages du téléphone, rubrique Notifications.';throw 0;}
    const reg=await swReady();
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await SB.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:S.uid,p256dh:j.keys.p256dh,auth:j.keys.auth});
    if(error){S.push.msg='Abonnement impossible côté serveur. As-tu lancé notifications.sql dans Supabase ?';throw 0;}
    S.push.on=true;toast('🔔 Notifications activées');
  }catch(e){if(e&&e.message&&!S.push.msg)S.push.msg='Activation impossible : '+e.message;}
  S.push.busy=false;render();
}
async function disablePush(){
  S.push.busy=true;render();
  try{const reg=await swReady();const sub=await reg.pushManager.getSubscription();
    if(sub){await SB.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();}}catch(e){}
  S.push.on=false;S.push.busy=false;render();toast('Notifications désactivées sur cet appareil');
}
function notifPref(k){return !(S.me&&S.me.notif&&S.me.notif[k]===false);}
function setNotifPref(k){S.me.notif=Object.assign({},S.me.notif||{},{[k]:!notifPref(k)});render();save();}
function notifHTML(){
  if(S.mode!=='shared')return '';
  const p=S.push;
  let body;
  if(!p.supported)body=`<p class="ro">${esc(p.msg)}</p>`;
  else if(!p.on)body=`<p class="ro" style="margin-top:0">Rappel à 20h, résultat de tes duels, alertes quand un pote te double, fin de pomodoro même app fermée.</p>${p.msg?`<p class="ro" style="color:var(--lose)">${esc(p.msg)}</p>`:''}<button class="btn wide" id="pushon" ${p.busy?'disabled':''}>Activer les notifications</button>`;
  else body=NOTIF_TYPES.map(([k,l])=>`<button class="item" role="checkbox" aria-checked="${notifPref(k)}" data-notif="${k}"><span class="txt"><span class="t">${l}</span></span><span class="ck"></span></button>`).join('')+`<button class="btn sec wide" id="pushtest">Envoyer une notification de test</button><button class="btn ghost wide" id="pushoff" ${p.busy?'disabled':''}>Désactiver sur cet appareil</button>`;
  return `<h2>Notifications</h2><div class="card">${body}</div>`;
}
async function schedulePomoPush(){
  if(!SB||!S.push.on||!notifPref('pomo'))return;
  try{
    await SB.from('push_scheduled').delete().eq('user_id',S.uid).eq('kind','pomo');
    if(!PM.running||!PM.endAt)return;
    const w=PM.phase==='work';const [wm,bm]=PM_PRESETS[PM.preset];
    await SB.from('push_scheduled').insert({user_id:S.uid,kind:'pomo',send_at:new Date(PM.endAt).toISOString(),
      title:w?'🍅 Pomodoro terminé':'☕ Pause terminée',body:w?'Bien joué ! Prends tes '+bm+' min de pause.':'On repart pour '+wm+' min de focus ?'});
  }catch(e){}
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.id==='pushon')enablePush();
  if(t.id==='pushtest'&&SB){SB.from('push_scheduled').insert({user_id:S.uid,kind:'test',send_at:new Date().toISOString(),title:'❄️ Test réussi',body:'Les notifications du winter arc fonctionnent sur cet appareil.'}).then(({error})=>toast(error?'Échec : as-tu lancé notifications.sql ?':'Envoyée ! Elle arrive en moins d’une minute.'));}if(t.id==='pushoff')disablePush();if(t.dataset.notif)setNotifPref(t.dataset.notif);});

// ================= boot (Supabase) =================
let SB=null;
function goSolo(){S.mode='solo';S.uid='solo';S.me=loadSolo();S.players=S.me?{solo:S.me}:{};recompute();render();}
S.auth={email:'',pw:'',busy:false,err:''};
async function fetchPlayers(){
  const {data,error}=await SB.from('players').select('id,data');
  if(error)throw error;
  const map={};for(const r of data||[])map[r.id]=r.data;
  const pendingLocal=!!(S.inflight||S.pending||saveTimer);
  if(pendingLocal&&S.me)map[S.uid]=S.me;
  else if(map[S.uid]&&!S.editing)S.me=JSON.parse(JSON.stringify(map[S.uid]));
  S.players=map;recompute();
  if(!S.editing||!document.activeElement||document.activeElement.tagName!=='INPUT')render();
}
async function startWith(uid){
  S.uid=uid;S.mode='loading';render();
  try{await fetchPlayers();}catch(e){toast('Connexion au serveur impossible.');}
  S.mode='shared';S.canWrite=true;recompute();render();refreshPush().then(()=>{if(S.tab==='perso')render();});
  setInterval(()=>{if(!document.hidden)fetchPlayers().catch(()=>{});},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchPlayers().catch(()=>{});});
}
const AUTH_ERR=m=>/invalid login/i.test(m)?'E-mail ou mot de passe incorrect.':/already registered|already exists/i.test(m)?'Ce compte existe déjà, connecte-toi.':/password/i.test(m)?'Le mot de passe doit faire au moins 6 caractères.':/email/i.test(m)?'Adresse e-mail invalide.':m;
async function doAuth(kind){
  const email=S.auth.email.trim(),pw=S.auth.pw;
  if(!email||!pw){S.auth.err='Remplis ton e-mail et ton mot de passe.';render();return;}
  S.auth.busy=true;S.auth.err='';render();
  try{
    const res=kind==='signup'?await SB.auth.signUp({email,password:pw}):await SB.auth.signInWithPassword({email,password:pw});
    if(res.error)throw res.error;
    const sess=res.data.session;
    if(!sess){S.auth.err='Compte créé, mais la confirmation par e-mail est activée dans Supabase. Désactive-la (voir le guide) puis connecte-toi.';S.auth.busy=false;render();return;}
    S.auth.busy=false;S.auth.pw='';startWith(sess.user.id);
  }catch(e){S.auth.busy=false;S.auth.err=AUTH_ERR(e.message||String(e));render();}
}
function authHTML(){
  const a=S.auth;
  return `<div class="join"><h3>Rejoins le winter arc</h3><p>Un compte par personne, pour retrouver ton perso sur tous tes appareils.</p>
   <label for="em">E-mail</label><input id="em" type="email" autocomplete="email" data-auth="email" value="${esc(a.email)}" placeholder="toi@exemple.fr">
   <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" data-auth="pw" value="${esc(a.pw)}" placeholder="6 caractères minimum">
   ${a.err?`<p class="ro" style="color:var(--lose)">${esc(a.err)}</p>`:''}
   <button class="btn wide" id="signin" ${a.busy?'disabled':''}>Se connecter</button>
   <button class="btn sec wide" id="signup" ${a.busy?'disabled':''} style="margin-top:8px">Créer mon compte</button></div>`;
}
function configHTML(){
  return `<div class="join"><h3>Configuration à vérifier</h3><p>${esc(S.cfgErr||'Renseigne l’URL et la clé de ton projet Supabase dans config.js.')}</p>${S.cfgSeen?`<p class="ro">Ce que l’app lit dans config.js :<br>URL = ${esc(S.cfgSeen.url||'(vide)')}<br>Clé = ${esc(S.cfgSeen.key?S.cfgSeen.key.slice(0,18)+'…':'(vide)')}</p>`:''}<button class="btn wide" id="solo">Tester en solo en attendant</button></div>`;
}

document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.auth;if(f)S.auth[f]=e.target.value;});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.id==='signin')doAuth('signin');if(t.id==='signup')doAuth('signup');if(t.id==='solo')goSolo();
  if(t.id==='signout'&&SB){SB.auth.signOut().finally(()=>location.reload());}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.mode==='auth'&&e.target.dataset&&e.target.dataset.auth)doAuth('signin');});
async function readConfig(){
  // Lecture tolérante : contourne le cache et accepte les guillemets typographiques.
  let url='',key='';
  try{
    const txt=await (await fetch('config.js?t='+Date.now(),{cache:'no-store'})).text();
    const q='["\u201C\u201D\u2018\u2019\u00AB\u00BB\'`]';
    const mu=txt.match(new RegExp('SUPABASE_URL\\s*:\\s*'+q+'\\s*([^"\u201C\u201D\u2018\u2019\u00AB\u00BB\'`\\s]+)'));
    const mk=txt.match(new RegExp('SUPABASE_KEY\\s*:\\s*'+q+'\\s*([^"\u201C\u201D\u2018\u2019\u00AB\u00BB\'`\\s]+)'));
    if(mu)url=mu[1];if(mk)key=mk[1];
  }catch(e){}
  const w=window.WA_CONFIG||{};
  if(!url&&w.SUPABASE_URL)url=w.SUPABASE_URL;if(!key&&w.SUPABASE_KEY)key=w.SUPABASE_KEY;
  url=String(url).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');key=String(key).trim();
  return {url,key};
}
async function boot(){
  render();
  const c=await readConfig();S.cfgSeen=c;
  let err='';
  if(!c.url||!c.key)err='config.js est introuvable ou ne contient pas les deux valeurs. Vérifie qu’il est bien à la racine du dépôt, à côté d’index.html.';
  else if(/COLLE_ICI/i.test(c.url+c.key))err='Les valeurs d’exemple COLLE_ICI… sont encore dans config.js en ligne. Remplace-les par ton Project URL et ta clé.';
  else if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.url))err='L’URL n’a pas le bon format. Elle doit ressembler à https://abcdefghijklmnop.supabase.co';
  else if(/^sb_secret_/i.test(c.key))err='C’est la clé secrète qui est dans config.js. Remplace-la tout de suite par la Publishable key (et régénère la clé secrète dans Supabase, elle est maintenant visible publiquement).';
  else if(!window.supabase||!window.supabase.createClient)err='La bibliothèque Supabase n’a pas pu se charger. Vérifie que le dossier vendor a bien été envoyé sur GitHub.';
  if(err){S.cfgErr=err;S.mode='config';render();return;}
  SB=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await SB.auth.getSession();
  if(data&&data.session)startWith(data.session.user.id);
  else{S.mode='auth';render();}
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
